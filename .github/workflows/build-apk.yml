name: Android checks
on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-36 build-tools;35.0.0'
          log-accepted-android-sdk-licenses: false
      - uses: gradle/actions/setup-gradle@v4
      - name: Test, lint and build
        run: |
          chmod +x ./gradlew
          ./gradlew testDebugUnitTest lintDebug assembleDebug bundleRelease --stacktrace --no-daemon
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: zombietime-checks
          path: |
            app/build/reports/
      - uses: actions/upload-artifact@v4
        with:
          name: zombietime-preview
          path: |
            app/build/outputs/apk/debug/*.apk
            app/build/outputs/bundle/release/*.aab
  ui-checks:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-36 build-tools;35.0.0'
          log-accepted-android-sdk-licenses: false
      - uses: gradle/actions/setup-gradle@v4
      - name: Enable emulator acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          chmod +x gradlew
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          target: google_apis
          profile: pixel_5
          disable-animations: false
          script: |
            ./gradlew connectedDebugAndroidTest --no-daemon
            adb pull /sdcard/Android/data/com.zombietime.app.preview/files/screenshots ui-screenshots
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ui-verification
          path: |
            ui-screenshots/
            app/build/reports/androidTests/
            app/build/outputs/androidTest-results/
  preview-release:
    needs: [build, ui-checks]
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    concurrency:
      group: preview-release-v1.2.0-preview.1
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: zombietime-preview
          path: preview-artifacts
      - name: Publish installable preview once
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: v1.2.0-preview.1
        shell: bash
        run: |
          set -euo pipefail
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Preview already published; preserving its assets."
            exit 0
          fi
          mkdir -p release-assets
          cp preview-artifacts/apk/debug/app-debug.apk release-assets/zombie-time-1.2-preview.apk
          cd release-assets
          sha256sum zombie-time-1.2-preview.apk > SHA256SUMS.txt
          cd ..
          gh release create "$TAG" release-assets/* \
            --target "$GITHUB_SHA" --prerelease \
            --title "좀비타임 1.2 테스트판" \
            --notes-file docs/TEST_RELEASE.md
