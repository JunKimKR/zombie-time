name: Build APK

on:
  push:
    branches: [ main, master ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: Build debug + release APK
        run: ./gradlew clean assembleDebug assembleRelease --stacktrace --no-daemon

      - name: Rename APKs
        run: |
          mkdir -p out
          cp app/build/outputs/apk/debug/app-debug.apk out/zombietime-debug.apk
          cp app/build/outputs/apk/release/app-release.apk out/zombietime-release.apk
          ls -lh out

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: zombietime-apk
          path: out/*.apk
          retention-days: 30

      - name: Publish latest release
        if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release delete latest --yes --cleanup-tag || true
          gh release create latest out/zombietime-debug.apk out/zombietime-release.apk \
            --title "좀비타임 최신 빌드" \
            --notes "커밋 ${GITHUB_SHA:0:7} 기준 자동 빌드된 APK 입니다. 폰에서 zombietime-release.apk 를 내려받아 설치하세요."
